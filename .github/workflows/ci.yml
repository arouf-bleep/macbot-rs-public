name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: training/requirements-verify.lock
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Provision the patched native OpenSSL LTS library
        run: |
          tls_lib="$(python scripts/provision_openssl.py --prefix "$RUNNER_TEMP/macbot-openssl-359" --jobs 2)"
          echo "LD_LIBRARY_PATH=$tls_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Confirm the selected native TLS version
        run: python -c 'import ssl; assert ssl.OPENSSL_VERSION.split()[1] == "3.5.9", ssl.OPENSSL_VERSION; ssl.create_default_context(); print(ssl.OPENSSL_VERSION)'
      - name: Provision the fixed native SQLite library
        run: |
          sqlite_lib="$(python scripts/provision_sqlite.py --prefix "$RUNNER_TEMP/macbot-sqlite-3510300")"
          echo "LD_LIBRARY_PATH=$sqlite_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Confirm the selected native SQLite version
        run: python -c 'import sqlite3; assert sqlite3.sqlite_version_info >= (3, 51, 3), sqlite3.sqlite_version; print(sqlite3.sqlite_version)'
      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip install 'torch==2.13.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements-verify.lock
          python -m pip check
      - name: Verify a fresh source export with the full verification gate
        env:
          MACBOT_VERIFY_TARGET_DIR: ${{ github.workspace }}/target.nosync
        run: |
          export MACBOT_VERIFY_PYTHON="$(command -v python)"
          stage="$(mktemp -d)"
          trap 'rm -rf -- "$stage"' EXIT
          git archive HEAD | tar -x -C "$stage"
          bash "$stage/scripts/verify_source_package.sh" "$stage"

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies for security advisories
        # The SQLx upgrade removed the RSA advisory from the lockfile. No
        # vulnerability exception is needed for this candidate.
        run: cargo audit
