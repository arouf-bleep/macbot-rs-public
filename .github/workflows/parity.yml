name: Decision and model parity
on:
  pull_request:
  push:
  workflow_dispatch:
concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.94.0
          # rust-toolchain.toml requests these components. Without declaring
          # them here, rustup tries to add them on first cargo invocation and
          # collides with the toolchain this action already installed.
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: training/requirements-verify.lock
      - name: Provision the patched native OpenSSL LTS library
        run: |
          tls_lib="$(python scripts/provision_openssl.py --prefix "$RUNNER_TEMP/macbot-openssl-359" --jobs 2)"
          echo "LD_LIBRARY_PATH=$tls_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Confirm the selected native TLS version
        run: python -c 'import ssl; assert ssl.OPENSSL_VERSION.split()[1] == "3.5.9", ssl.OPENSSL_VERSION; ssl.create_default_context(); print(ssl.OPENSSL_VERSION)'
      - name: Provision the fixed native SQLite library
        run: |
          sqlite_lib="$(python scripts/provision_sqlite.py --prefix "$RUNNER_TEMP/macbot-sqlite-3510300")"
          echo "LD_LIBRARY_PATH=$sqlite_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Confirm the selected native SQLite version
        run: python -c 'import sqlite3; assert sqlite3.sqlite_version_info >= (3, 51, 3), sqlite3.sqlite_version; print(sqlite3.sqlite_version)'
      - name: Install pinned CPU validation dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip install 'torch==2.13.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements-verify.lock
          python -m pip check
      - name: Capture and compare production stages and model outputs
        run: |
          export MACBOT_PARITY_PYTHON="$(command -v python)"
          export MACBOT_ONNX_RUNTIME_CACHE="$RUNNER_TEMP/macbot-runtime-cache"
          MACBOT_ONNX_RUNTIME_LIB="$(python scripts/setup_onnx_runtime.py)"
          export MACBOT_ONNX_RUNTIME_LIB
          bash scripts/verify_decision_parity.sh artifacts/parity/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-parity-evidence
          path: |
            artifacts/parity/ci/decisions.jsonl
            artifacts/parity/ci/*report.json
