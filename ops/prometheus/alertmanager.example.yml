global:
  resolve_timeout: 5m

route:
  receiver: "default-log"
  group_by: ["alertname", "service", "severity"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="page"
      receiver: "page-log"
      repeat_interval: 30m

receivers:
  - name: "default-log"
  - name: "page-log"

# Replace receivers with Slack/PagerDuty/webhook integrations for production.
