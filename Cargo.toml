[package]
name    = "macbot-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "A research-grade Polymarket execution, risk, and observability engine"
license-file = "LICENSE.md"
publish = false

[lints.clippy]
# Contract-specific argument exceptions and current-thread test environment
# leases are documented at their individual functions; production lints stay on.
# Tests intentionally keep helpers below their local modules and use process-wide
# environment/configuration locks around async integration points.
items_after_test_module = "allow"
field_reassign_with_default = "allow"
cloned_ref_to_slice_refs = "allow"

[[bin]]
name = "macbot"
path = "src/main.rs"

[dependencies]
# ── Async runtime ────────────────────────────────────────────────────────────
tokio        = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# ── HTTP ─────────────────────────────────────────────────────────────────────
reqwest    = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum       = { version = "0.7", features = ["macros", "ws"] }
tower      = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Database ─────────────────────────────────────────────────────────────────
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }
# SQLite 3.51.3 fixes the WAL-reset corruption race. Pin the bundled native
# library independently of SQLx's intentionally broad compatible version range.
libsqlite3-sys = { version = "=0.37.0", default-features = false, features = ["bundled"] }

# ── Ethereum / CLOB signing ──────────────────────────────────────────────────
# Only local EIP-712 signing is used; provider/contract transports add unused
# dependencies (including the affected lru cache).
alloy = { version = "1", default-features = false, features = ["std", "signer-local", "sol-types"] }

# ── HMAC for L2 API key auth ─────────────────────────────────────────────────
hmac   = "0.12"
sha2   = "0.10"
base64 = "0.22"
hex    = "0.4"

# ── Time ─────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# ── Env + config ──────────────────────────────────────────────────────────────
dotenvy = "0.15"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow    = "1"
thiserror = "1"

# ── Logging ───────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ── Concurrent caches ────────────────────────────────────────────────────────
dashmap = "5"

# ── Lazy statics ─────────────────────────────────────────────────────────────
once_cell = "1"

# ── Security ────────────────────────────────────────────────────────────────
subtle  = "2"
zeroize = { version = "1", features = ["derive"] }

# ── ONNX Runtime (deep model inference) ────────────────────────────────────
ort     = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-27"] }
libloading = "0.9"
libc = "0.2"
ndarray = "0.17"

# ── Misc ─────────────────────────────────────────────────────────────────────
rand = "0.8"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Pulled in only to select the TLS backend explicitly at startup; see main.rs.
rustls     = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

[dev-dependencies]
proptest = "1.5"
